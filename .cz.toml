[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.1"
tag_format = "v$version"
# package.json is the single source of truth: vite.config.ts reads it and
# defines __APP_VERSION__, so the version on screen cannot drift from the tag.
version_files = ["package.json:\"version\""]
update_changelog_on_bump = true
changelog_incremental = true
changelog_file = "docs/CHANGELOG.md"
# Past 1.0.0: the game box is in the family's hands, so a breaking change is a
# real major, not a footnote in the minor.
major_version_zero = false
